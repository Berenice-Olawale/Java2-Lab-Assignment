spring.application.name=demo

# ---- Database -------------------------------------------------------------
# Local machine (XAMPP): database "java_seminar", user root, empty password.
# On the Linux server the DB name, user and password are all your Neptun code
# in lowercase. Do NOT hard-code the server password here, set it with
# environment variables (DB_NAME, DB_USER, DB_PASSWORD, MYSQL_HOST) instead.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${DB_NAME:java_seminar}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# ---- Site -----------------------------------------------------------------
app.name=ReNew Notebooks
# Shown in the footer of EVERY page (task 2). Fill in real names + Neptun codes.
app.creators=NAME 1 (NEPTUN1), NAME 2 (NEPTUN2)

# ---- Default admin account (created at startup if it does not exist) ------
app.admin.username=admin
app.admin.password=Admin123!
