<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Notebook Form')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: navbar('crud')}"></nav>

<main class="flex-grow-1 container py-4">

    <h1 th:text="${notebook.id == null} ? 'Add Notebook' : 'Edit Notebook'">
        Notebook Form
    </h1>

    <form th:action="@{/crud/save}" method="post" th:object="${notebook}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Manufacturer</label>
            <input type="text" class="form-control" th:field="*{manufacturer}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" class="form-control" th:field="*{type}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Display</label>
            <input type="text" class="form-control" th:field="*{display}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Memory</label>
            <input type="number" class="form-control" th:field="*{memory}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Harddisk</label>
            <input type="number" class="form-control" th:field="*{harddisk}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Video Controller</label>
            <input type="text" class="form-control" th:field="*{videocontroller}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Pieces</label>
            <input type="number" class="form-control" th:field="*{pieces}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Processor</label>
            <select name="processorId" class="form-select" required>
                <option value="">-- Select processor --</option>

                <option th:each="p : ${processors}"
                        th:value="${p.id}"
                        th:text="${p.manufacturer + ' ' + p.type}"
                        th:selected="${notebook.processor != null and notebook.processor.id == p.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Operating System</label>
            <select name="opsystemId" class="form-select" required>
                <option value="">-- Select operating system --</option>

                <option th:each="o : ${opsystems}"
                        th:value="${o.id}"
                        th:text="${o.osname}"
                        th:selected="${notebook.opsystem != null and notebook.opsystem.id == o.id}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/crud}" class="btn btn-secondary">Cancel</a>

    </form>

</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
