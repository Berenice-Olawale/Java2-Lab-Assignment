<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chart')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: navbar('chart')}"></nav>

<main class="flex-grow-1 container py-4">
    <h1 class="mb-1">Chart</h1>
    <p class="text-muted">Charts showing notebook manufacturers and operating system stock.</p>

    <div class="row g-4">
        <div class="col-12 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Models per manufacturer</h2>
                    <canvas id="byManufacturer"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Pieces in stock per operating system</h2>
                    <canvas id="stockByOs"></canvas>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script th:inline="javascript">
    const mLabels = /*[[${mLabels}]]*/ [];
    const mValues = /*[[${mValues}]]*/ [];
    const oLabels = /*[[${oLabels}]]*/ [];
    const oValues = /*[[${oValues}]]*/ [];

    new Chart(document.getElementById('byManufacturer'), {
        type: 'bar',
        data: {
            labels: mLabels,
            datasets: [{
                label: 'Number of models',
                data: mValues
            }]
        },
        options: {
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    new Chart(document.getElementById('stockByOs'), {
        type: 'doughnut',
        data: {
            labels: oLabels,
            datasets: [{
                data: oValues
            }]
        },
        options: {
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });
</script>

</body>
</html>
