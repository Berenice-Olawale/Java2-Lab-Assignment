<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Common <head>. Theme: "Flatly" from Bootswatch (free responsive Bootstrap 5 theme). -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ' + ${appName}">Page | App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>

<body>

<!-- Common menu, used on every page: ~{fragments :: navbar('home')} -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" th:text="${appName}">App</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">Mainpage</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'database'} ? 'active'" th:href="@{/database}">Database</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'contact'} ? 'active'" th:href="@{/contact}">Contact</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'chart'} ? 'active'" th:href="@{/chart}">Chart</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'rest'} ? 'active'" th:href="@{/rest}">REST</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('USER','ADMIN')"><a class="nav-link" th:classappend="${active == 'messages'} ? 'active'" th:href="@{/messages}">Messages</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:classappend="${active == 'crud'} ? 'active'" th:href="@{/crud}">CRUD</a></li>
            </ul>
            <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:classappend="${active == 'login'} ? 'active'" th:href="@{/login}">Login</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:classappend="${active == 'register'} ? 'active'" th:href="@{/register}">Registration</a></li>
                <li class="nav-item navbar-text me-lg-3" sec:authorize="isAuthenticated()">
                    Logged in: <strong sec:authentication="name">user</strong>
                    <span class="badge bg-warning text-dark ms-1" sec:authorize="hasRole('ADMIN')">admin</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Common footer with the creators (names + Neptun codes) - set in application.properties (app.creators) -->
<footer th:fragment="footer" class="site-footer mt-auto py-3 bg-dark text-light">
    <div class="container text-center small">
        &copy; 2026 <span th:text="${appName}">App</span> &ndash; Created by:
        <strong th:text="${creators}">NAME (NEPTUN)</strong>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
